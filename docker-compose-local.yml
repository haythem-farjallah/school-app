version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school-redis-local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - school-local-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: school-prometheus-local
    ports:
      - "9090:9090"
    volumes:
      - ./devops/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - school-local-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: school-grafana-local
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/datasource-local.yml:/etc/grafana/provisioning/datasources/datasource.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - school-local-network
    depends_on:
      - loki

  # Loki Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: school-loki-local
    ports:
      - "3100:3100"
    volumes:
      - ./devops/loki/loki-simple.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    networks:
      - school-local-network

  # Promtail Log Shipper
  promtail:
    image: grafana/promtail:2.9.0
    container_name: school-promtail-local
    volumes:
      - ./devops/promtail/promtail-config.yml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    restart: unless-stopped
    networks:
      - school-local-network
    depends_on:
      - loki

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  school-local-network:
    driver: bridge
