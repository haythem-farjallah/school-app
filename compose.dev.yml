# Local development dependencies only (no application containers).
#   docker compose -f compose.dev.yml up -d
# Credentials are local-only and match backend/src/main/resources/application-dev.properties.
name: school-app

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: school_db
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
