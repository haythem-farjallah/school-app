# Local development defaults. Matches compose.dev.yml (PostgreSQL + Redis on localhost).
# Every value can still be overridden with the matching environment variable.
# Never activate this profile outside a developer machine or a CI job.

spring.datasource.url=jdbc:postgresql://localhost:5432/school_db
spring.datasource.username=school
spring.datasource.password=school

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Local-only signing key; production must provide JWT_SECRET.
jwt.secret=local-dev-only-jwt-signing-key-change-me-0123456789

# No SMTP server is part of the local stack; outgoing mail fails and is logged.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=no-reply@school.local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
