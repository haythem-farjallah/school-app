# -----------------------------------------------------
# APPLICATION CONFIG
# -----------------------------------------------------
# Environment-specific values are never committed here. They are supplied
# through environment variables (Spring relaxed binding) or a profile:
#
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD
#   JWT_SECRET
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#   MANAGEMENT_OTLP_TRACING_ENDPOINT   (optional, enables trace export)
#   LOKI_URL                           (optional, with the loki-enabled profile)
#
# Local development: SPRING_PROFILES_ACTIVE=dev (see application-dev.properties).
# dev also enables the deterministic fixture accounts (DevFixtureLoader).
spring.application.name=school-management-backend
spring.profiles.group.dev=fixtures

# -----------------------------------------------------
# SERVER CONFIG
# -----------------------------------------------------
server.port=8088
server.tomcat.relaxed-query-chars=[,]

# -----------------------------------------------------
# DATABASE (PostgreSQL) & FLYWAY MIGRATIONS
# -----------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=db-pool

# Flyway owns the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------
# ACTUATOR
# -----------------------------------------------------
# Exposed: health and prometheus (Micrometer metrics in Prometheus text format). Health is the only
# public endpoint; prometheus, and anything an environment adds through
# MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, requires an ADMIN token (SecurityConfig).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Probe groups, served on every platform (not only Kubernetes) at /actuator/health/liveness and
# /actuator/health/readiness. Both are public and, like /actuator/health, report only a status.
# Liveness: is the process alive? Application state only, never PostgreSQL or Redis, so a
# dependency outage does not get a healthy JVM restarted.
# Readiness: can this instance serve traffic? Also needs PostgreSQL and Redis; the rate limiter
# fails closed, so no request can be served while Redis is down. Mail is not a dependency.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# -----------------------------------------------------
# JWT
# -----------------------------------------------------
# jwt.secret is required and has no default (JWT_SECRET).
jwt.token.prefix=Bearer
# Access tokens live 15 minutes (JWT_EXPIRATION_MS); the frontend renews them with the refresh token.
jwt.expiration.ms=900000
# Refresh tokens live 24 hours from login (JWT_REFRESH_EXPIRATION_MS). Refreshing issues only a new
# access token, so this deadline is absolute; after it the user logs in again.
jwt.refresh.expiration.ms=86400000

# -----------------------------------------------------
# ALLOWED BROWSER ORIGINS
# -----------------------------------------------------
# Comma-separated exact origins allowed to call the API (CORS) and open a WebSocket
# (APP_SECURITY_ALLOWED_ORIGINS).
app.security.allowed-origins=http://localhost:5173

# Exact immediate proxy IPs trusted to supply forwarding headers.
# Empty by default: direct requests ignore X-Forwarded-For and X-Real-IP.
# Comma-separated (APP_SECURITY_TRUSTED_PROXIES).
app.security.trusted-proxies=

# -----------------------------------------------------
# SPRINGDOC OPENAPI (Swagger UI)
# -----------------------------------------------------
# API documentation is only served in local development (enabled by the dev profile).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# -----------------------------------------------------
# LOGGING
# -----------------------------------------------------
logging.level.root=INFO
logging.level.com.github.loki4j=WARN
# Every line carries the X-Request-ID of the HTTP request that produced it (empty outside a request).
logging.pattern.level=%5p [requestId=%X{requestId:-}]

# -----------------------------------------------------
# MAIL
# -----------------------------------------------------
# Host and credentials are required per environment (SPRING_MAIL_*).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# -----------------------------------------------------
# Thymeleaf
# -----------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/email/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# OptaPlanner Configuration
optaplanner.solver.termination.spent-limit=30s
optaplanner.solver.termination.unimproved-spent-limit=10s
optaplanner.solver-manager.parallel-solver-count=4

# -----------------------------------------------------
# FILE UPLOAD CONFIGURATION
# -----------------------------------------------------
# Multipart configuration is handled programmatically in FileUploadConfig.java
app.file.upload.path=uploads/learning-resources
app.file.upload.max-size=104857600
app.file.upload.allowed-extensions=pdf,doc,docx,ppt,pptx,xls,xlsx,txt,mp4,avi,mov,wmv,flv,webm,mkv,jpg,jpeg,png,gif,bmp,webp,mp3,wav,ogg,aac,flac

# -----------------------------------------------------
# REDIS
# -----------------------------------------------------
# Host defaults to localhost; override with SPRING_DATA_REDIS_HOST.
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.cache.redis.enable-statistics=true

management.health.redis.enabled=true

# Disable OptaPlanner only (keep tracing/observation features for monitoring)
spring.autoconfigure.exclude=org.optaplanner.spring.boot.autoconfigure.OptaPlannerAutoConfiguration
spring.main.allow-bean-definition-overriding=true

# -----------------------------------------------------
# DISTRIBUTED TRACING
# -----------------------------------------------------
# Trace ids are always created; spans are exported only when
# MANAGEMENT_OTLP_TRACING_ENDPOINT is set (e.g. http://tempo:4318/v1/traces).
management.tracing.sampling.probability=1.0
